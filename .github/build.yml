name: Build zOpoiii Downloader

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Extract project ZIP
        run: |
          rm -rf project
          mkdir project
          unzip -q zopoiii-downloader.zip -d project

      - name: Setup JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          accept-android-sdk-licenses: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.3.1'

      - name: Check project
        working-directory: project
        run: |
          echo "=== PROJECT ==="
          ls -la
          echo "=== APP ==="
          ls -la app

      - name: Build APK
        working-directory: project
        run: |
          gradle clean assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zOpoiii-Downloader
          path: project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
